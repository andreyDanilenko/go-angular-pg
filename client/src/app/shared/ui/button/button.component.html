<button
  class="button"
  [class]="'button button--' + variant + ' button--' + size"
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading"
  (click)="handleClick()"
>
  @if (loading) {
    <span class="button__spinner" aria-hidden="true"></span>
  }
  <span><ng-content /></span>
</button>

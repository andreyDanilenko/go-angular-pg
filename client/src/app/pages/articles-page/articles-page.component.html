<section class="layout-container layout-stack articles-page">
  <app-articles-list-header
    [query]="query()"
    [sort]="sort()"
    (queryChange)="query.set($event)"
    (sortChange)="sort.set($event)"
  />

  @if (isLoading()) {
    <app-spinner label="Загружаем посты…" />
  } @else if (errorMessage()) {
    <app-alert>{{ errorMessage() }}</app-alert>
    <button class="retry-button" type="button" (click)="loadArticles()">
      Попробовать снова
    </button>
  } @else {
    <app-article-list [articles]="visibleArticles()" />
  }
</section>

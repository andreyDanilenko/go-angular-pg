<section class="layout-container profile-edit-page">
  @if (isLoading() && !user()) {
    <app-spinner label="Загружаем профиль…" />
  } @else if (user(); as currentUser) {
    <header>
      <p class="profile-edit-page__eyebrow">Аккаунт</p>
      <h1>Редактирование профиля</h1>
      <p>{{ currentUser.email }}</p>
    </header>

    <form class="profile-form layout-stack" [formGroup]="form" (ngSubmit)="save()">
      @if (errorMessage()) {
        <app-alert>{{ errorMessage() }}</app-alert>
      }

      <div class="profile-form__grid">
        <app-input
          inputId="username"
          label="Никнейм"
          autocomplete="nickname"
          errorMessage="От 3 до 50 символов"
          [control]="form.controls.username"
        />
        <app-input
          inputId="firstName"
          label="Имя"
          autocomplete="given-name"
          errorMessage="От 2 до 50 символов"
          [control]="form.controls.firstName"
        />
        <app-input
          inputId="lastName"
          label="Фамилия"
          autocomplete="family-name"
          errorMessage="От 2 до 50 символов"
          [control]="form.controls.lastName"
        />
        <app-input
          inputId="middleName"
          label="Отчество"
          errorMessage="Не более 50 символов"
          [control]="form.controls.middleName"
        />
      </div>

      <app-textarea
        inputId="bio"
        label="Обо мне"
        placeholder="Расскажите немного о себе"
        errorMessage="Не более 2000 символов"
        [control]="form.controls.bio"
      />

      <div class="layout-cluster profile-form__actions">
        <app-button variant="secondary" (pressed)="cancel()">Отмена</app-button>
        <app-button type="submit" [loading]="isSaving()">Сохранить</app-button>
      </div>
    </form>
  } @else {
    <app-alert>Профиль недоступен. Вернитесь назад и повторите попытку.</app-alert>
  }
</section>

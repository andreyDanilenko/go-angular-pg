<header class="header">
  <div class="layout-container header__content">
    <a class="header__brand" routerLink="/articles">LifeDream</a>

    <nav class="header__navigation" aria-label="Основная навигация">
      <a routerLink="/articles" routerLinkActive="header__link--active">Посты</a>
      <a routerLink="/profile" routerLinkActive="header__link--active">Профиль</a>
    </nav>

    <div class="header__actions">
      @if (displayName()) {
        <span class="header__user">{{ displayName() }}</span>
      }
      <app-theme-toggle />
    </div>
  </div>
</header>

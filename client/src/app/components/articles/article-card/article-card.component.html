<a class="article-card" [routerLink]="['/articles', article.id]">
  <div
    [class]="'article-card__visual article-card__visual--' + article.category"
    aria-hidden="true"
  >
    {{ categoryLabel(article.category) }}
  </div>

  <div class="article-card__content">
    <span class="article-card__category">{{ categoryLabel(article.category) }}</span>
    <h2 class="article-card__title">{{ article.title }}</h2>
    <p class="article-card__excerpt">{{ article.content }}</p>
    <footer class="article-card__meta">
      <span>{{ article.authorName || 'Без автора' }}</span>
      <time [attr.datetime]="article.createdAt">
        {{ article.createdAt | date: 'd MMMM y' }}
      </time>
    </footer>
  </div>
</a>

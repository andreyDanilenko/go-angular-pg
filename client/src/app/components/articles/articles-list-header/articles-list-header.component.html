<header class="articles-header">
  <div>
    <p class="articles-header__eyebrow">Публикации</p>
    <h1>Посты</h1>
  </div>

  <div class="articles-header__controls">
    <label class="search">
      <span class="sr-only">Поиск постов</span>
      <input
        type="search"
        placeholder="Поиск по заголовку и тексту"
        [value]="query"
        (input)="updateQuery($event)"
      />
    </label>

    <label>
      <span class="sr-only">Сортировка постов</span>
      <select [value]="sort" (change)="updateSort($event)">
        <option value="newest">Сначала новые</option>
        <option value="oldest">Сначала старые</option>
        <option value="title">По названию</option>
      </select>
    </label>
  </div>
</header>

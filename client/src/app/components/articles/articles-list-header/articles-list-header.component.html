<header class="articles-header">
  <div>
    <p class="articles-header__eyebrow">Публикации</p>
    <div class="articles-header__title-row">
      <h1>Посты</h1>
      <app-button size="small" (pressed)="createArticle.emit()">Создать</app-button>
    </div>
  </div>

  <div class="articles-header__controls">
    <label class="search">
      <span class="sr-only">Поиск постов</span>
      <input
        type="search"
        placeholder="Поиск по заголовку и тексту"
        [value]="query"
        (input)="updateQuery($event)"
      />
    </label>

    <label>
      <span class="sr-only">Фильтр по категории</span>
      <select [value]="category" (change)="updateCategory($event)">
        <option value="all">Все категории</option>
        <option value="general">Общее</option>
        <option value="tech">Технологии</option>
        <option value="science">Наука</option>
        <option value="politics">Политика</option>
        <option value="health">Здоровье</option>
      </select>
    </label>

    <label>
      <span class="sr-only">Сортировка постов</span>
      <select [value]="sort" (change)="updateSort($event)">
        <option value="newest">Сначала новые</option>
        <option value="oldest">Сначала старые</option>
        <option value="title">По названию</option>
      </select>
    </label>
  </div>
</header>
